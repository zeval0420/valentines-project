<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You ♡</title>
  <style>
    /* ===== CSS CUSTOM PROPERTIES ===== */
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: rgba(0, 0, 0, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.3);
      --accent-rose: rgba(255, 182, 193, 0.6);
      --accent-lavender: rgba(230, 190, 255, 0.6);
      --text-light: rgba(255, 255, 255, 0.95);
      --text-dim: rgba(255, 255, 255, 0.7);
      
      /* Background layer controls */
      --bg-blur: 40px;
      --bg-opacity: 0.15;
      --bg-brightness: 0.7;
    }

    /* ===== GLOBAL RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
      /* Animated gradient background */
      background: linear-gradient(135deg, 
        #667eea 0%, 
        #764ba2 25%, 
        #f093fb 50%, 
        #f5576c 75%, 
        #667eea 100%
      );
      background-size: 400% 400%;
      animation: gradientShift 20s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* ===== PARTICLE BACKGROUND ===== */
    .particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      background-color: var(--glass-highlight);
      border-radius: 50%;
      opacity: 0;
      animation: floatUp ease-in-out infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 0;
      }
      10% {
        opacity: 0.7;
      }
      90% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-105vh);
        opacity: 0;
      }
    }


    /* ===== INFINITE GALLERY CONTAINER ===== */
    .gallery-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      z-index: 10;
      mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .gallery-container:active {
      cursor: grabbing;
    }

    .gallery-track {
      display: flex;
      gap: 2rem;
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      will-change: transform;
      padding: 0 2rem;
    }

    /* ===== GLASS IMAGE CARDS (Enhanced with background refraction) ===== */
    .gallery-item {
      flex-shrink: 0;
      width: 280px;
      height: 380px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      
      /* Enhanced glass effect - refracts background */
      backdrop-filter: blur(16px) saturate(180%);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.1),
        rgba(255, 255, 255, 0.05)
      );
      border: 1px solid var(--glass-border);
      box-shadow: 
        0 8px 32px var(--glass-shadow),
        inset 0 1px 0 var(--glass-highlight),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1);
      
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .gallery-item::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.2) 0%,
        transparent 50%,
        rgba(255, 255, 255, 0.1) 100%
      );
      opacity: 0.5;
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 1;
    }

    .gallery-item:hover {
      transform: scale(1.05) translateY(-8px);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.9;
      transition: opacity 0.3s ease;
    }

    .gallery-item:hover img {
      opacity: 1;
    }

    /* ===== CENTRAL GLASS BUTTON ===== */
    .memory-button {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      
      padding: 18px 42px;
      border-radius: 50px;
      border: 1px solid var(--glass-border);
      
      /* Glass effect */
      backdrop-filter: blur(16px) saturate(200%);
      background: linear-gradient(135deg, 
        var(--accent-rose), 
        var(--accent-lavender)
      );
      box-shadow: 
        0 12px 40px rgba(255, 105, 180, 0.3),
        inset 0 1px 0 var(--glass-highlight);
      
      font-size: 18px;
      font-weight: 500;
      color: var(--text-light);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      letter-spacing: 0.5px;
      
      cursor: pointer;
      user-select: none;
      
      /* Breathing animation */
      animation: breathe 4s ease-in-out infinite;
      
      transition: all 0.3s ease;
    }

    @keyframes breathe {
      0%, 100% { 
        transform: translateX(-50%) scale(1);
        opacity: 0.95;
      }
      50% { 
        transform: translateX(-50%) scale(1.05);
        opacity: 1;
      }
    }

    .memory-button:active {
      transform: translateX(-50%) scale(0.95);
      box-shadow: 
        0 6px 20px rgba(255, 105, 180, 0.4),
        inset 0 1px 0 var(--glass-highlight);
    }

    /* ===== MODAL OVERLAY ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      
      backdrop-filter: blur(20px) brightness(0.6);
      background: rgba(0, 0, 0, 0.5);
      
      display: flex;
      align-items: center;
      justify-content: center;
      
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===== POLAROID CAROUSEL ===== */
    .polaroid-carousel {
      position: relative;
      width: 90vw;
      max-width: 400px;
      height: 520px;
      perspective: 1000px;
    }

    .polaroid {
      position: absolute;
      width: 100%;
      height: 100%;
      
      background: #fdfcf8;
      border-radius: 8px;
      padding: 20px 20px 60px 20px;
      
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 8px 16px rgba(0, 0, 0, 0.2);
      
      transform-origin: center center;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      
      opacity: 0;
      pointer-events: none;
    }

    .polaroid.active {
      opacity: 1;
      pointer-events: all;
      transform: rotate(0deg) translateX(0) scale(1);
    }

    .polaroid.prev {
      opacity: 0;
      transform: rotate(-8deg) translateX(-120%) scale(0.8);
    }

    .polaroid.next {
      opacity: 0;
      transform: rotate(8deg) translateX(120%) scale(0.8);
    }

    .polaroid-image {
      width: 100%;
      height: 360px;
      background: #e8e8e8;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .polaroid-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .polaroid-caption {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      line-height: 1.5;
      color: #333;
      text-align: center;
      font-style: italic;
      /* Handwritten feel */
      transform: rotate(-0.5deg);
    }

    /* ===== CAROUSEL ARROWS ===== */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      font-weight: bold;
      color: var(--text-light);
      z-index: 210;
      transition: all 0.3s ease;
      user-select: none;
    }

    .carousel-arrow:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-50%) scale(1.1);
    }

    .carousel-arrow.left {
      left: 15px;
    }

    .carousel-arrow.right {
      right: 15px;
    }

    /* ===== CLOSE BUTTON ===== */
    .close-button {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      
      backdrop-filter: blur(12px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      
      display: flex;
      align-items: center;
      justify-content: center;
      
      cursor: pointer;
      font-size: 24px;
      color: var(--text-light);
      
      transition: all 0.3s ease;
    }

    .close-button:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(90deg);
    }

    /* ===== NAVIGATION DOTS ===== */
    .carousel-dots {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dot.active {
      background: rgba(255, 255, 255, 0.9);
      transform: scale(1.3);
    }

    /* ===== MUSIC TOGGLE ===== */
    .music-toggle {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 150;
      
      width: 50px;
      height: 50px;
      border-radius: 50%;
      
      backdrop-filter: blur(12px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      
      display: flex;
      align-items: center;
      justify-content: center;
      
      cursor: pointer;
      font-size: 20px;
      color: var(--text-light);
      
      transition: all 0.3s ease;
    }

    .music-toggle:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.1);
    }

    .music-toggle.playing {
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 105, 180, 0.7); }
      50% { box-shadow: 0 0 0 15px rgba(255, 105, 180, 0); }
    }

    /* ===== LOADING FADE IN ===== */
    body {
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ===== MOBILE OPTIMIZATIONS ===== */
    @media (max-width: 768px) {
      .gallery-item {
        width: 75vw;
        height: 95vw;
      }
      
      .memory-button {
        bottom: 15vh;
        padding: 16px 36px;
        font-size: 16px;
      }
      
      .polaroid-carousel {
        height: 530px;
      }
      
      .polaroid-image {
        height: 400px;
      }

      .polaroid-caption {
        font-size: 14px;
      }

      .carousel-arrow {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
      .carousel-arrow.left {
        left: 5px;
      }
      .carousel-arrow.right {
        right: 5px;
      }
    }

    /* Reduce motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      .memory-button {
        animation: none;
      }
      
      .polaroid {
        transition-duration: 0.2s;
      }
    }
  </style>

  <style>
    /* Floating Notes */
    #notes-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .note {
      position: absolute;
      bottom: -150px; /* Start off-screen */
      left: 50%;
      padding: 15px 20px;
      background: rgba(255, 240, 245, 0.9); /* Lavender blush, slightly transparent */
      border-radius: 5px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      font-family: 'Courier New', monospace;
      font-size: 16px;
      color: #555;
      pointer-events: all;
      contenteditable: true;
      animation: floatUpNote linear;
      border: 1px solid rgba(0, 0, 0, 0.1);
      min-width: 150px;
      min-height: 50px;
    }

    .note:focus {
      outline: 2px solid var(--accent-rose);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
    }

    @keyframes floatUpNote {
      to {
        transform: translateY(-110vh) rotate(0deg);
        opacity: 0;
      }
    }
  </style>
</head>

  <script>
    // ========================================
    // FLOATING LOVE NOTES
    // ========================================
    const loveMessages = [
      "You're my everything",
      "My heart is yours",
      "Forever and always",
      "You make my world beautiful",
      "Thinking of you",
      "My dream come true",
      "Can't wait to see you",
      "You're the best part of my day"
    ];

    function addNote() {
      const container = document.getElementById('notes-container');
      const note = document.createElement('div');
      note.className = 'note';
      
      // Pick a random message or use a default
      if (loveMessages.length > 0) {
        note.textContent = loveMessages[Math.floor(Math.random() * loveMessages.length)];
      } else {
        note.textContent = 'I love you...'; // Default text
      }

      // Randomize starting position and angle
      const startX = Math.random() * 80 + 10; // % from left (10% to 90%)
      const startAngle = (Math.random() - 0.5) * 40; // -20deg to +20deg
      const endAngle = startAngle + (Math.random() - 0.5) * 60; // Add some rotation
      const flightTime = Math.random() * 15 + 15; // 15 to 30 seconds

      note.style.left = `${startX}%`;
      note.style.animationDuration = `${flightTime}s`;
      
      // We set the initial transform and the 'to' state of the animation here
      note.style.transform = `translateX(-50%) rotate(${startAngle}deg)`;
      
      // A bit of a hack to define the end state of the animation dynamically
      const styleSheet = document.styleSheets[0];
      const keyframesName = `floatUpNote_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
      const keyframes = `
        @keyframes ${keyframesName} {
          to {
            transform: translateX(-50%) translateY(-110vh) rotate(${endAngle}deg);
            opacity: 0;
          }
        }
      `;
      styleSheet.insertRule(keyframes, styleSheet.cssRules.length);
      note.style.animationName = keyframesName;


      container.appendChild(note);

      // Clean up the dynamically added keyframes rule after the animation ends
      note.addEventListener('animationend', () => {
        note.remove();
        // Find and remove the rule
        for (let i = 0; i < styleSheet.cssRules.length; i++) {
          if (styleSheet.cssRules[i].name === keyframesName) {
            styleSheet.deleteRule(i);
            break;
          }
        }
      });
    }

    // Example: Add a new note every 7 seconds
    setInterval(addNote, 5500);
    
    // Add one note on load
    addNote();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");

  <script>
    // ========================================
    // STATE MANAGEMENT
    // ========================================
    
    let currentPolaroidIndex = 0;
    let hasInteracted = false;
    let galleryScrollSpeed = 0.3;
    let galleryOffset = 0;
    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    let musicPlaying = false;

    // ========================================
    // DOM ELEMENTS
    // ========================================
    
    const galleryTrack = document.getElementById('galleryTrack');
    const memoryButton = document.getElementById('memoryButton');
    const modalOverlay = document.getElementById('modalOverlay');
    const closeButton = document.getElementById('closeButton');
    const polaroidCarousel = document.getElementById('polaroidCarousel');
    const carouselDots = document.getElementById('carouselDots');
    const musicToggle = document.getElementById('musicToggle');
    const bgMusic = document.getElementById('bgMusic');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');

    // ========================================
    // PARTICLE BACKGROUND SETUP
    // ========================================
    function initParticles() {
      const particleContainer = document.createElement('div');
      particleContainer.className = 'particle-container';
      document.body.prepend(particleContainer);

      const numParticles = 30;
      for (let i = 0; i < numParticles; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const size = Math.random() * 6 + 2; // 2px to 8px
        particle.style.left = `${Math.random() * 100}vw`;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.animationDuration = `${Math.random() * 10 + 10}s`; // 10 to 20 seconds
        particle.style.animationDelay = `${Math.random() * 10}s`;
    
        // Add horizontal offset for variation
        particle.style.transform = `translateX(${(Math.random() - 0.5) * 40}px)`;
        
        particleContainer.appendChild(particle);
      }
    }
    
    // ========================================
    // INFINITE GALLERY SETUP
    // ========================================
    
    function initGallery() {
      // Create enough duplicates for seamless loop
      const duplicates = 3; // Show 3 full sets
      let allImages = [];
      
      for (let i = 0; i < duplicates; i++) {
        allImages.push(...galleryImages);
      }
      
      allImages.forEach((imgSrc, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `<img src="assets/gallery/${imgSrc}" alt="Gallery Image ${index + 1}" loading="lazy">`;
        galleryTrack.appendChild(item);
      });
    }

    // ========================================
    // GALLERY ANIMATION LOOP
    // ========================================
    
    function animateGallery() {
      if (!isDragging) {
        galleryOffset -= galleryScrollSpeed;
        
        const trackWidth = galleryTrack.scrollWidth / (galleryImages.length > 0 ? 3 : 1);
        
        if (trackWidth > 0 && Math.abs(galleryOffset) >= trackWidth) {
          galleryOffset = 0;
        }
        
        galleryTrack.style.transform = `translateY(-50%) translateX(${galleryOffset}px)`;
      }
      
      requestAnimationFrame(animateGallery);
    }

    // ========================================
    // TOUCH/MOUSE DRAG HANDLING
    // ========================================
    
    function handleDragStart(e) {
      isDragging = true;
      startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
      currentX = startX;
      galleryTrack.style.cursor = 'grabbing';
      triggerFirstInteraction();
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      
      const x = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
      const diff = x - currentX;
      currentX = x;
      galleryOffset += diff * 2;
      
      galleryTrack.style.transform = `translateY(-50%) translateX(${galleryOffset}px)`;
    }

    function handleDragEnd() {
      isDragging = false;
      galleryTrack.style.cursor = 'grab';
    }

    galleryTrack.addEventListener('mousedown', handleDragStart);
    galleryTrack.addEventListener('mousemove', handleDragMove);
    galleryTrack.addEventListener('mouseup', handleDragEnd);
    galleryTrack.addEventListener('mouseleave', handleDragEnd);
    galleryTrack.addEventListener('touchstart', handleDragStart);
    galleryTrack.addEventListener('touchmove', handleDragMove);
    galleryTrack.addEventListener('touchend', handleDragEnd);

    // ========================================
    // POLAROID CAROUSEL SETUP
    // ========================================
    
    function initPolaroids() {
      polaroidCarousel.innerHTML = '';
      carouselDots.innerHTML = '';
      if (polaroidImages.length === 0) {
        prevArrow.style.display = 'none';
        nextArrow.style.display = 'none';
        return;
      }
      prevArrow.style.display = 'flex';
      nextArrow.style.display = 'flex';

      polaroidImages.forEach((imgSrc, index) => {
        const polaroid = document.createElement('div');
        polaroid.className = `polaroid ${index === 0 ? 'active' : 'next'}`;
        polaroid.innerHTML = `
          <div class="polaroid-image">
            <img data-src="assets/polaroids/${imgSrc}" alt="Polaroid Memory ${index + 1}">
          </div>
          <div class="polaroid-caption">${imgSrc.split('.').slice(0, -1).join('.')}</div>
        `;
        
        const randomTilt = (Math.random() - 0.5) * 4;
        polaroid.style.transform += ` rotate(${randomTilt}deg)`;
        polaroidCarousel.appendChild(polaroid);
        
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.addEventListener('click', () => goToPolaroid(index));
        carouselDots.appendChild(dot);
      });
      goToPolaroid(0);
    }


    // ========================================
    // CAROUSEL NAVIGATION
    // ========================================
    
    function goToPolaroid(index) {
        if (polaroidImages.length === 0) return;
        const polaroids = document.querySelectorAll('.polaroid');
        const dots = document.querySelectorAll('.dot');
        const total = polaroids.length;

        currentPolaroidIndex = index;

        polaroids.forEach((polaroid, i) => {
            polaroid.classList.remove('active', 'prev', 'next');
            if (i === index) {
                polaroid.classList.add('active');
            } else if (i === (index - 1 + total) % total) {
                polaroid.classList.add('prev');
            } else {
                polaroid.classList.add('next');
            }

            // Lazy load the image for the active, next, and previous slides
            const isActive = i === index;
            const isPrev = i === (index - 1 + total) % total;
            const isNext = i === (index + 1) % total;
            if (isActive || isPrev || isNext) {
                const img = polaroid.querySelector('img');
                if (img && img.dataset.src && !img.src) {
                    img.src = img.dataset.src;
                }
            }
        });

        dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === index);
        });
    }


    function nextPolaroid() {
        if (polaroidImages.length === 0) return;
        goToPolaroid((currentPolaroidIndex + 1) % polaroidImages.length);
    }

    function prevPolaroid() {
        if (polaroidImages.length === 0) return;
        goToPolaroid((currentPolaroidIndex - 1 + polaroidImages.length) % polaroidImages.length);
    }

    // --- Arrow button navigation ---
    prevArrow.addEventListener('click', prevPolaroid);
    nextArrow.addEventListener('click', nextPolaroid);

    // --- Swipe and drag navigation ---
    let carouselIsDragging = false;
    let carouselStartX = 0;
    let carouselEndX = 0;

    const handleCarouselDragStart = (e) => {
        carouselIsDragging = true;
        carouselStartX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
        polaroidCarousel.style.cursor = 'grabbing';
    };

    const handleCarouselDragEnd = (e) => {
        if (!carouselIsDragging) return;
        carouselIsDragging = false;
        // For mouseup, pageX is what we need. For touchend, it's in changedTouches.
        carouselEndX = e.type.includes('mouse') ? e.pageX : e.changedTouches[0].pageX;
        polaroidCarousel.style.cursor = 'grab';

        const swipeThreshold = 50;
        const diff = carouselStartX - carouselEndX;

        if (Math.abs(diff) > swipeThreshold) {
            if (diff > 0) {
                nextPolaroid();
            } else {
                prevPolaroid();
            }
        }
    };
    
    polaroidCarousel.addEventListener('mousedown', handleCarouselDragStart);
    polaroidCarousel.addEventListener('mouseup', handleCarouselDragEnd);
    polaroidCarousel.addEventListener('mouseleave', handleCarouselDragEnd); // End drag if mouse leaves
    
    polaroidCarousel.addEventListener('touchstart', handleCarouselDragStart, { passive: true });
    polaroidCarousel.addEventListener('touchend', handleCarouselDragEnd);
    

    // ========================================
    // MODAL CONTROLS
    // ========================================
    
    memoryButton.addEventListener('click', () => {
      modalOverlay.classList.add('active');
      triggerFirstInteraction();

      // If music isn't playing, start it.
      if (bgMusic.paused) {
        musicPlaying = true; // Set user's intent to play
        bgMusic.play().then(() => {
          musicToggle.textContent = '🎵';
          musicToggle.classList.add('playing');
          fadeInMusic(0.5, 1500);
        }).catch(error => console.error("Music play failed:", error));
      } else {
        // If already playing, just ensure the volume is right for the modal.
        fadeInMusic(0.5, 1500);
      }
    });

    closeButton.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      // Close if clicking on the overlay itself, not the children (arrows, polaroid)
      if (e.target === modalOverlay) closeModal();
    });

    function closeModal() {
      modalOverlay.classList.remove('active');
      fadeInMusic(0.3, 2000);
    }

    // ========================================
    // MUSIC SYSTEM
    // ========================================
    
    function triggerFirstInteraction() {
      if (!hasInteracted) {
        hasInteracted = true;
        if (musicPlaying) {
          fadeInMusic(0.3, 2000);
        }
      }
    }

    function fadeInMusic(targetVolume, duration) {
      if (!musicPlaying) return;
      
      const startVolume = bgMusic.volume;
      const volumeDiff = targetVolume - startVolume;
      let startTime = null;

      function updateVolume(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const eased = 0.5 - 0.5 * Math.cos(progress * Math.PI);
        
        bgMusic.volume = startVolume + (volumeDiff * eased);
        
        if (progress < 1) {
          requestAnimationFrame(updateVolume);
        }
      }
      requestAnimationFrame(updateVolume);
    }

    musicToggle.addEventListener('click', () => {
      if (!bgMusic.paused) {
        bgMusic.pause();
        musicPlaying = false;
        musicToggle.textContent = '🔇';
        musicToggle.classList.remove('playing');
      } else {
        musicPlaying = true;
        bgMusic.play().then(() => {
            musicToggle.textContent = '🎵';
            musicToggle.classList.add('playing');
            if (hasInteracted) {
                fadeInMusic(modalOverlay.classList.contains('active') ? 0.5 : 0.3, 2000);
            }
        }).catch(error => console.error("Music play failed:", error));
      }
    });

    window.addEventListener('wheel', triggerFirstInteraction, { once: true });
    window.addEventListener('touchstart', triggerFirstInteraction, { once: true });

    // ========================================
    // INITIALIZATION
    // ========================================
    function initializeApp() {
        initParticles();
        initGallery();
        initPolaroids();
        requestAnimationFrame(animateGallery);
    }
    
    initializeApp();

  </script>

</body>
