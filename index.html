<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You ♡</title>
  <style>
    /* ===== CSS CUSTOM PROPERTIES ===== */
    :root {
      --paper-bg: #fdfbf7;
      --text-dark: #4a4a4a;
      --text-light: #fdfbf7;
      --border-color: #dcd1c1;
      --shadow-color: rgba(0, 0, 0, 0.1);
      --accent-color: #c8a2c8; /* A dusty lilac */
      --accent-color-light: #e6d8e6;
    }

    /* ===== GLOBAL RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Courier New', monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
      background-color: var(--paper-bg);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
      color: var(--text-dark);
    }

    /* ===== INFINITE GALLERY CONTAINER ===== */
    .gallery-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
      z-index: 10;
      mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .gallery-container:active {
      cursor: grabbing;
    }

    .gallery-track {
      display: flex;
      gap: 2rem;
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      will-change: transform;
      padding: 0 2rem;
    }

    /* ===== SCRAPBOOK IMAGE CARDS ===== */
    .gallery-item {
      flex-shrink: 0;
      width: 280px;
      height: 380px;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #fff;
      border: 10px solid #fff;
      border-bottom-width: 20px;
      box-shadow: 0 5px 15px var(--shadow-color);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform: rotate(-2deg);
    }

    .gallery-item:nth-child(even) {
      transform: rotate(2deg);
    }

    .gallery-item:hover {
      transform: scale(1.05) translateY(-8px) rotate(0deg);
      z-index: 11;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(0.2) contrast(0.95) brightness(1.05);
    }

    /* ===== CENTRAL BUTTON ===== */
    .memory-button {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      padding: 12px 30px;
      border-radius: 4px;
      border: 1px solid var(--text-dark);
      background: transparent;
      font-size: 18px;
      font-weight: normal;
      color: var(--text-dark);
      letter-spacing: 1px;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
    }

    .memory-button:hover {
      background: rgba(74, 74, 74, 0.05);
      letter-spacing: 2px;
    }

    .memory-button:active {
      transform: translateX(-50%) scale(0.95);
      background: rgba(74, 74, 74, 0.1);
    }

    /* ===== MODAL OVERLAY ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      background: rgba(40, 40, 40, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    /* ===== POLAROID CAROUSEL ===== */
    .polaroid-carousel {
      position: relative;
      width: 90vw;
      max-width: 400px;
      height: 520px;
      perspective: 1000px;
    }

    .polaroid {
      position: absolute;
      width: 100%;
      height: 100%;
      
      background: #fdfcf8;
      border-radius: 8px;
      padding: 20px 20px 60px 20px;
      
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 8px 16px rgba(0, 0, 0, 0.2);
      
      transform-origin: center center;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      
      opacity: 0;
      pointer-events: none;
    }

    .polaroid.active {
      opacity: 1;
      pointer-events: all;
      transform: rotate(0deg) translateX(0) scale(1);
    }

    .polaroid.prev {
      opacity: 0;
      transform: rotate(-8deg) translateX(-120%) scale(0.8);
    }

    .polaroid.next {
      opacity: 0;
      transform: rotate(8deg) translateX(120%) scale(0.8);
    }

    .polaroid-image {
      width: 100%;
      height: 360px;
      background: #e8e8e8;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .polaroid-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .polaroid-caption {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      line-height: 1.5;
      color: #333;
      text-align: center;
      font-style: italic;
      /* Handwritten feel */
      transform: rotate(-0.5deg);
    }

    /* ===== CAROUSEL ARROWS ===== */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      font-weight: bold;
      color: var(--text-light); /* White text on dark overlay */
      z-index: 210;
      transition: all 0.3s ease;
      user-select: none;
    }

    .carousel-arrow:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-50%) scale(1.1);
    }

    .carousel-arrow.left {
      left: 15px;
    }

    .carousel-arrow.right {
      right: 15px;
    }

    /* ===== CLOSE BUTTON ===== */
    .close-button {
      position: absolute;
      top: 30px;
      right: 30px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 24px;
      color: var(--text-light); /* White text on dark overlay */
      transition: all 0.3s ease;
    }

    .close-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(90deg);
    }

    /* ===== NAVIGATION DOTS ===== */
    .carousel-dots {
      position: absolute;
      bottom: -50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .dot.active {
      background: rgba(255, 255, 255, 0.9);
      transform: scale(1.3);
    }

    /* ===== MUSIC TOGGLE ===== */
    .music-toggle {
      position: fixed;
      top: 30px;
      right: 30px;
      z-index: 150;
      
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      color: var(--text-dark);
      transition: all 0.3s ease;
    }

    .music-toggle:hover {
      background: rgba(74, 74, 74, 0.05);
      transform: scale(1.1);
    }

    .music-toggle.playing {
      animation: pulse 2s ease infinite;
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(200, 162, 200, 0.7); }
      50% { box-shadow: 0 0 0 15px rgba(200, 162, 200, 0); }
    }

    /* ===== LOADING FADE IN ===== */
    body {
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ===== MOBILE OPTIMIZATIONS ===== */
    @media (max-width: 768px) {
      .gallery-item {
        width: 75vw;
        height: 95vw;
      }
      
      .memory-button {
        bottom: 15vh;
        padding: 16px 36px;
        font-size: 16px;
      }
      
      .polaroid-carousel {
        height: 530px;
      }
      
      .polaroid-image {
        height: 400px;
      }

      .polaroid-caption {
        font-size: 14px;
      }

      .carousel-arrow {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }
      .carousel-arrow.left {
        left: 5px;
      }
      .carousel-arrow.right {
        right: 5px;
      }
    }

    /* Reduce motion for accessibility */
    @media (prefers-reduced-motion: reduce) {
      
      .polaroid {
        transition-duration: 0.2s;
      }
    }

    /* ===== BACKGROUND SHAPES ===== */
    .bg-shape-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .bg-shape-wrapper {
      position: absolute;
      bottom: -10vh;
      will-change: transform;
      pointer-events: none;
    }

    .bg-shape {
      position: relative;
      animation: floatUpBackground linear infinite;
      will-change: transform;
    }

    @keyframes floatUpBackground {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-120vh) rotate(calc(360deg * var(--rotation-dir))); }
    }

    /* ===== GRAIN OVERLAY ===== */
    body::after {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      pointer-events: none;
      z-index: 9000;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 600 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
      animation: grain 8s steps(10, end) infinite;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -10%); }
      20% { transform: translate(-15%, 5%); }
      30% { transform: translate(7%, -25%); }
      40% { transform: translate(-5%, 25%); }
      50% { transform: translate(-15%, 10%); }
      60% { transform: translate(15%, 0%); }
      70% { transform: translate(0%, 15%); }
      80% { transform: translate(3%, 35%); }
      90% { transform: translate(-10%, 10%); }
    }
  </style>

  <style>
    /* Floating Notes */
    #notes-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .note {
      position: absolute;
      bottom: -150px; /* Start off-screen */
      left: 50%;
      padding: 15px 20px;
      background: #fffff0; /* Ivory, like a sticky note */
      border-radius: 5px;
      box-shadow: 0 4px 10px var(--shadow-color);
      font-family: 'Courier New', monospace;
      font-size: 16px;
      color: var(--text-dark);
      pointer-events: all;
      contenteditable: true;
      animation: floatUpNote linear;
      border: 1px solid #eaddc5;
      min-width: 150px;
      min-height: 50px;
    }

    .note:focus {
      outline: 2px solid var(--accent-color);
      box-shadow: 0 6px 20px var(--shadow-color);
    }

    @keyframes floatUpNote {
      to {
        transform: translateY(-110vh) rotate(0deg);
        opacity: 0;
      }
    }

    /* ===== INTRO OVERLAY ===== */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background-color: #fdfbf7;
      /* Subtle paper texture using noise */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.1'/%3E%3C/svg%3E");
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 1.5s ease-in-out;
    }

    .intro-text {
      font-family: 'Courier New', monospace;
      font-size: 1.5rem;
      color: #4a4a4a;
      text-align: center;
      padding: 20px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 1.5s ease, transform 1.5s ease;
      max-width: 80%;
      line-height: 1.6;
    }

    .intro-text.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #start-button {
      margin-top: 40px;
      padding: 12px 30px;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      background: transparent;
      border: 1px solid #4a4a4a;
      color: #4a4a4a;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.8s ease;
      pointer-events: none;
    }

    #start-button.visible {
      opacity: 1;
      pointer-events: all;
    }

    #start-button:hover {
      background: rgba(74, 74, 74, 0.1);
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- ===== INTRO OVERLAY ===== -->
  <div id="intro-overlay">
    <div id="intro-text-container" class="intro-text"></div>

  <!-- ===== FLOATING NOTES ===== -->

  <!-- ===== INFINITE GALLERY ===== -->

  <!-- ===== CENTRAL BUTTON ===== -->
  <button class="memory-button" id="memoryButton">
    open memories

  <!-- ===== MUSIC TOGGLE ===== -->

  <!-- ===== MODAL CAROUSEL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="close-button" id="closeButton">×</div>
    
    <div class="carousel-arrow left" id="prevArrow">‹</div>

    </div>

    <div class="carousel-dots" id="carouselDots"></div>
  </div>

  <!-- ===== BACKGROUND AUDIO ===== -->
  <audio id="bgMusic" loop>
    <!-- REPLACE THIS: Add your romantic ambient music file -->
    <source src="ambient.flac" type="audio/flac">
  </audio>

  <script src="file_list.js"></script>


  <script>
    // ========================================
    // FLOATING LOVE NOTES
    // ========================================
    const loveMessages = [
      "You're the moon that glows in the sky",
      "And I miss you on a train, I miss you in the morning",
      "No, I have never felt a love like this before",
      "YAnd I'll kiss you good morning \nFor every morning you stay",
      "But now my heart's singing and tonight I'll be fine",
      "Your colors caught my eye\nAnd you're my favorite sight to see",
      "But still I wanna be with you every single day 'til the day that we die",
      "Well, you are the only exception",
      "I'd love to figure love out with you",
      "And when you see that we were meant to be all along",
      "Don't you ever think I'm bothered by you",
      "Just like me, they long to be close to you",
      "My love will always stay by you",
      "Never thought I'd find you, but you're here, and so I love you",
      "You'll be her in my heart always",
      "You hold me like I'm the one who's precious \nI hate to break it to you, but it's just the other way around"
    ];

    function addNote() {
      const container = document.getElementById('notes-container');
      const note = document.createElement('div');
      note.className = 'note';
      
      // Pick a random message or use a default
      if (loveMessages.length > 0) {
        note.textContent = loveMessages[Math.floor(Math.random() * loveMessages.length)];
      } else {
        note.textContent = 'I love you...'; // Default text
      }

      // Randomize starting position and angle
      const startX = Math.random() * 80 + 10; // % from left (10% to 90%)
      const startAngle = (Math.random() - 0.5) * 40; // -20deg to +20deg
      const endAngle = startAngle + (Math.random() - 0.5) * 60; // Add some rotation
      const flightTime = Math.random() * 15 + 15; // 15 to 30 seconds

      note.style.left = `${startX}%`;
      note.style.animationDuration = `${flightTime}s`;
      
      // We set the initial transform and the 'to' state of the animation here
      note.style.transform = `translateX(-50%) rotate(${startAngle}deg)`;
      
      // A bit of a hack to define the end state of the animation dynamically
      const styleSheet = document.styleSheets[0];
      const keyframesName = `floatUpNote_${Date.now()}_${Math.floor(Math.random() * 1000)}`;
      const keyframes = `
        @keyframes ${keyframesName} {
          to {
            transform: translateX(-50%) translateY(-110vh) rotate(${endAngle}deg);
            opacity: 0;
          }
        }
      `;
      styleSheet.insertRule(keyframes, styleSheet.cssRules.length);
      note.style.animationName = keyframesName;


      container.appendChild(note);

      // Clean up the dynamically added keyframes rule after the animation ends
      note.addEventListener('animationend', () => {
        note.remove();
        // Find and remove the rule
        for (let i = 0; i < styleSheet.cssRules.length; i++) {
          if (styleSheet.cssRules[i].name === keyframesName) {
            styleSheet.deleteRule(i);
            break;
          }
        }
      });
    }

    // Example: Add a new note every 7 seconds
    function startFloatingNotes() {
      setInterval(addNote, 5500);
      addNote();
    }
  </script>

  <script>
    // ========================================
    // STATE MANAGEMENT
    // ========================================
    
    // Ensure variables exist if file_list.js is missing (e.g. in APK)
    if (typeof galleryImages === 'undefined') window.galleryImages = [];
    if (typeof polaroidImages === 'undefined') window.polaroidImages = [];
    
    let currentPolaroidIndex = 0;
    let hasInteracted = false;
    let galleryScrollSpeed = 0.3;
    let galleryOffset = 0;
    let isDragging = false;
    let startX = 0;
    let currentX = 0;
    let musicPlaying = false;
    // New variables for inertia
    let galleryVelocity = 0;
    const FRICTION = 0.95; // How quickly momentum fades
    const MIN_VELOCITY = 0.1; // Below this, momentum stops
    const DRAG_MULTIPLIER = 2; // How sensitive the drag is

    // ========================================
    // DOM ELEMENTS
    // ========================================
    
    const galleryTrack = document.getElementById('galleryTrack');
    const galleryContainer = document.getElementById('galleryContainer');
    const memoryButton = document.getElementById('memoryButton');
    const modalOverlay = document.getElementById('modalOverlay');
    const closeButton = document.getElementById('closeButton');
    const polaroidCarousel = document.getElementById('polaroidCarousel');
    const carouselDots = document.getElementById('carouselDots');
    const musicToggle = document.getElementById('musicToggle');
    const bgMusic = document.getElementById('bgMusic');
    const prevArrow = document.getElementById('prevArrow');
    const nextArrow = document.getElementById('nextArrow');

    // ========================================
    // INFINITE GALLERY SETUP
    // ========================================
    
    function initGallery() {
      // Create enough duplicates for seamless loop
      const duplicates = 3; // Show 3 full sets
      let allImages = [];
      
      for (let i = 0; i < duplicates; i++) {
        allImages.push(...galleryImages);
      }
      
      allImages.forEach((imgSrc, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `<img src="assets/gallery/${imgSrc}" alt="Gallery Image ${index + 1}" loading="lazy">`;
        galleryTrack.appendChild(item);
      });
    }

    // ========================================
    // GALLERY ANIMATION LOOP
    // ========================================
    
    function animateGallery() {
      if (!isDragging) {
        // If there's momentum from a drag
        if (Math.abs(galleryVelocity) > MIN_VELOCITY) {
          galleryOffset += galleryVelocity;
          galleryVelocity *= FRICTION; // Apply friction
        } else {
          // Otherwise, do the auto-scroll
          galleryVelocity = 0;
          galleryOffset -= galleryScrollSpeed;
        }
      }
      
      // Infinite loop logic - apply regardless of dragging state to handle wrapping
      const trackWidth = galleryTrack.scrollWidth / 3;
      if (trackWidth > 0) {
        // Use while loops to handle large offsets from fast drags in a single frame
        while (galleryOffset <= -trackWidth) {
          galleryOffset += trackWidth;
        }
        while (galleryOffset > 0) {
          galleryOffset -= trackWidth;
        }
      }
      
      galleryTrack.style.transform = `translateY(-50%) translateX(${galleryOffset}px)`;
      requestAnimationFrame(animateGallery);
    }

    // ========================================
    // TOUCH/MOUSE DRAG HANDLING
    // ========================================
    
    function handleDragStart(e) {
      isDragging = true;
      galleryVelocity = 0; // Stop any existing motion
      startX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
      currentX = startX;
      galleryContainer.style.cursor = 'grabbing';
      triggerFirstInteraction();
    }

    function handleDragMove(e) {
      if (!isDragging) return;
      
      e.preventDefault();
      const x = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
      const diff = x - currentX;
      
      galleryOffset += diff * DRAG_MULTIPLIER;
      // Set velocity for inertia calculation on release
      galleryVelocity = diff * DRAG_MULTIPLIER;
      
      currentX = x;
    }

    function handleDragEnd() {
      isDragging = false;
      galleryContainer.style.cursor = 'grab';
      // The animateGallery loop will now use the last calculated galleryVelocity for inertia
    }

    galleryContainer.addEventListener('mousedown', handleDragStart);
    galleryContainer.addEventListener('mousemove', handleDragMove);
    galleryContainer.addEventListener('mouseup', handleDragEnd);
    galleryContainer.addEventListener('mouseleave', handleDragEnd);
    galleryContainer.addEventListener('touchstart', handleDragStart);
    galleryContainer.addEventListener('touchmove', handleDragMove);
    galleryContainer.addEventListener('touchend', handleDragEnd);

    // ========================================
    // POLAROID CAROUSEL SETUP
    // ========================================
    
    function initPolaroids() {
      polaroidCarousel.innerHTML = '';
      carouselDots.innerHTML = '';
      if (polaroidImages.length === 0) {
        prevArrow.style.display = 'none';
        nextArrow.style.display = 'none';
        return;
      }
      prevArrow.style.display = 'flex';
      nextArrow.style.display = 'flex';

      polaroidImages.forEach((imgSrc, index) => {
        const polaroid = document.createElement('div');
        polaroid.className = `polaroid ${index === 0 ? 'active' : 'next'}`;
        polaroid.innerHTML = `
          <div class="polaroid-image">
            <img data-src="assets/polaroids/${imgSrc}" alt="Polaroid Memory ${index + 1}">
          </div>
          <div class="polaroid-caption">${imgSrc.split('.').slice(0, -1).join('.')}</div>
        `;
        
        const randomTilt = (Math.random() - 0.5) * 4;
        polaroid.style.transform += ` rotate(${randomTilt}deg)`;
        polaroidCarousel.appendChild(polaroid);
        
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.addEventListener('click', () => goToPolaroid(index));
        carouselDots.appendChild(dot);
      });
      goToPolaroid(0);
    }


    // ========================================
    // CAROUSEL NAVIGATION
    // ========================================
    
    function goToPolaroid(index) {
        if (polaroidImages.length === 0) return;
        const polaroids = document.querySelectorAll('.polaroid');
        const dots = document.querySelectorAll('.dot');
        const total = polaroids.length;

        currentPolaroidIndex = index;

        polaroids.forEach((polaroid, i) => {
            polaroid.classList.remove('active', 'prev', 'next');
            if (i === index) {
                polaroid.classList.add('active');
            } else if (i === (index - 1 + total) % total) {
                polaroid.classList.add('prev');
            } else {
                polaroid.classList.add('next');
            }

            // Lazy load the image for the active, next, and previous slides
            const isActive = i === index;
            const isPrev = i === (index - 1 + total) % total;
            const isNext = i === (index + 1) % total;
            if (isActive || isPrev || isNext) {
                const img = polaroid.querySelector('img');
                if (img && img.dataset.src && !img.src) {
                    img.src = img.dataset.src;
                }
            }
        });

        dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === index);
        });
    }


    function nextPolaroid() {
        if (polaroidImages.length === 0) return;
        goToPolaroid((currentPolaroidIndex + 1) % polaroidImages.length);
    }

    function prevPolaroid() {
        if (polaroidImages.length === 0) return;
        goToPolaroid((currentPolaroidIndex - 1 + polaroidImages.length) % polaroidImages.length);
    }

    // --- Arrow button navigation ---
    prevArrow.addEventListener('click', prevPolaroid);
    nextArrow.addEventListener('click', nextPolaroid);

    // --- Swipe and drag navigation ---
    let carouselIsDragging = false;
    let carouselStartX = 0;
    let carouselEndX = 0;

    const handleCarouselDragStart = (e) => {
        carouselIsDragging = true;
        carouselStartX = e.type.includes('mouse') ? e.pageX : e.touches[0].pageX;
        polaroidCarousel.style.cursor = 'grabbing';
    };

    const handleCarouselDragEnd = (e) => {
        if (!carouselIsDragging) return;
        carouselIsDragging = false;
        // For mouseup, pageX is what we need. For touchend, it's in changedTouches.
        carouselEndX = e.type.includes('mouse') ? e.pageX : e.changedTouches[0].pageX;
        polaroidCarousel.style.cursor = 'grab';

        const swipeThreshold = 50;
        const diff = carouselStartX - carouselEndX;

        if (Math.abs(diff) > swipeThreshold) {
            if (diff > 0) {
                nextPolaroid();
            } else {
                prevPolaroid();
            }
        }
    };
    
    polaroidCarousel.addEventListener('mousedown', handleCarouselDragStart);
    polaroidCarousel.addEventListener('mouseup', handleCarouselDragEnd);
    polaroidCarousel.addEventListener('mouseleave', handleCarouselDragEnd); // End drag if mouse leaves
    
    polaroidCarousel.addEventListener('touchstart', handleCarouselDragStart, { passive: true });
    polaroidCarousel.addEventListener('touchend', handleCarouselDragEnd);
    

    // ========================================
    // MODAL CONTROLS
    // ========================================
    
    memoryButton.addEventListener('click', () => {
      modalOverlay.classList.add('active');
      triggerFirstInteraction();

      // If music isn't playing, start it.
      if (bgMusic.paused) {
        musicPlaying = true; // Set user's intent to play
        bgMusic.play().then(() => {
          musicToggle.textContent = '🎵';
          musicToggle.classList.add('playing');
          fadeInMusic(0.5, 1500);
        }).catch(error => console.error("Music play failed:", error));
      } else {
        // If already playing, just ensure the volume is right for the modal.
        fadeInMusic(0.5, 1500);
      }
    });

    closeButton.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      // Close if clicking on the overlay itself, not the children (arrows, polaroid)
      if (e.target === modalOverlay) closeModal();
    });

    function closeModal() {
      modalOverlay.classList.remove('active');
      fadeInMusic(0.3, 2000);
    }

    // ========================================
    // MUSIC SYSTEM
    // ========================================
    
    function triggerFirstInteraction() {
      if (!hasInteracted) {
        hasInteracted = true;
        if (musicPlaying) {
          fadeInMusic(0.3, 2000);
        }
      }
    }

    function fadeInMusic(targetVolume, duration) {
      if (!musicPlaying) return;
      
      const startVolume = bgMusic.volume;
      const volumeDiff = targetVolume - startVolume;
      let startTime = null;

      function updateVolume(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        
        const eased = 0.5 - 0.5 * Math.cos(progress * Math.PI);
        
        bgMusic.volume = startVolume + (volumeDiff * eased);
        
        if (progress < 1) {
          requestAnimationFrame(updateVolume);
        }
      }
      requestAnimationFrame(updateVolume);
    }

    musicToggle.addEventListener('click', () => {
      if (!bgMusic.paused) {
        bgMusic.pause();
        musicPlaying = false;
        musicToggle.textContent = '🔇';
        musicToggle.classList.remove('playing');
      } else {
        musicPlaying = true;
        bgMusic.play().then(() => {
            musicToggle.textContent = '🎵';
            musicToggle.classList.add('playing');
            if (hasInteracted) {
                fadeInMusic(modalOverlay.classList.contains('active') ? 0.5 : 0.3, 2000);
            }
        }).catch(error => console.error("Music play failed:", error));
      }
    });

    window.addEventListener('wheel', triggerFirstInteraction, { once: true });
    window.addEventListener('touchstart', triggerFirstInteraction, { once: true });

    // ========================================
    // INITIALIZATION
    // ========================================
    
    let mouseX = 0;
    let mouseY = 0;
    let targetMouseX = 0;
    let targetMouseY = 0;

    document.addEventListener('mousemove', (e) => {
      targetMouseX = (e.clientX / window.innerWidth) - 0.5;
      targetMouseY = (e.clientY / window.innerHeight) - 0.5;
    });

    function animateParallax() {
      mouseX += (targetMouseX - mouseX) * 0.05;
      mouseY += (targetMouseY - mouseY) * 0.05;

      const wrappers = document.querySelectorAll('.bg-shape-wrapper');
      wrappers.forEach(wrapper => {
        const depth = parseFloat(wrapper.getAttribute('data-depth'));
        const moveX = mouseX * depth;
        const moveY = mouseY * depth;
        wrapper.style.transform = `translate(${moveX}px, ${moveY}px)`;
      });
      requestAnimationFrame(animateParallax);
    }

    function initBackgroundShapes() {
      const container = document.createElement('div');
      container.className = 'bg-shape-container';
      // Insert before gallery container
      const gallery = document.getElementById('galleryContainer');
      document.body.insertBefore(container, gallery);

      const shapes = ['♥', '♡', '★', '☆', '•', '∘'];
      const numShapes = 25;

      for (let i = 0; i < numShapes; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'bg-shape-wrapper';
        
        // Random horizontal position
        wrapper.style.left = `${Math.random() * 100}vw`;
        
        // Random depth for parallax
        const depth = (Math.random() - 0.5) * 100;
        wrapper.setAttribute('data-depth', depth);

        const shape = document.createElement('div');
        shape.className = 'bg-shape';
        shape.textContent = shapes[Math.floor(Math.random() * shapes.length)];
        
        // Random size
        const size = Math.random() * 1.5 + 0.5; // 0.5rem to 2rem
        shape.style.fontSize = `${size}rem`;
        
        // Random animation duration and delay
        const duration = Math.random() * 20 + 20; // 20-40s
        const delay = Math.random() * -40; // Start mid-animation
        
        shape.style.animationDuration = `${duration}s`;
        shape.style.animationDelay = `${delay}s`;
        
        // Random opacity/color
        const opacity = Math.random() * 0.15 + 0.05; 
        shape.style.color = `rgba(74, 74, 74, ${opacity})`;
        
        // Random rotation direction
        const rotationDir = Math.random() > 0.5 ? 1 : -1;
        shape.style.setProperty('--rotation-dir', rotationDir);

        wrapper.appendChild(shape);
        container.appendChild(wrapper);
      }
      
      requestAnimationFrame(animateParallax);
    }

    function initializeApp() {
        initBackgroundShapes();
        initGallery();
        initPolaroids();
        startFloatingNotes();
        requestAnimationFrame(animateGallery);
    }
    
    // ========================================
    // INTRO SEQUENCE
    // ========================================
    const introOverlay = document.getElementById('intro-overlay');
    const introTextContainer = document.getElementById('intro-text-container');
    const startButton = document.getElementById('start-button');
    
    const introSentences = [
      "Crazy to think we've already been together for three years, huh",
      "I don't know where I would be right now if you hadn't confessed",
      "But I'm quite happy that we turned out this way :)"
    ];

    async function playIntro() {
      // Small delay before starting
      await new Promise(r => setTimeout(r, 1000));

      for (const sentence of introSentences) {
        introTextContainer.textContent = "";
        
        // Disable transition for instant appearance of container for typing effect
        introTextContainer.style.transition = 'none';
        introTextContainer.classList.add('visible');
        
        // Type out character by character
        for (const char of sentence) {
          introTextContainer.textContent += char;
          await new Promise(r => setTimeout(r, 50)); 
        }
        
        await new Promise(r => setTimeout(r, 2000)); // Display time
        
        // Re-enable transition for fade out
        introTextContainer.style.transition = '';
        introTextContainer.classList.remove('visible');
        await new Promise(r => setTimeout(r, 1500)); // Fade out/wait time
      }
      
      // Show button
      startButton.classList.add('visible');
    }

    startButton.addEventListener('click', () => {
      introOverlay.style.opacity = '0';
      setTimeout(() => {
        introOverlay.style.display = 'none';
        initializeApp(); // Start the main app
        
        // Start music
        musicPlaying = true;
        bgMusic.play().then(() => {
            musicToggle.textContent = '🎵';
            musicToggle.classList.add('playing');
            fadeInMusic(0.3, 2000);
        }).catch(e => console.log("Audio autoplay prevented", e));
        
      }, 1500);
    });

    // Start intro on load
    window.addEventListener('load', playIntro);

  </script>

</body>
